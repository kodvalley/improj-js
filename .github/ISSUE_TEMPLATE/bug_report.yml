name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste API tokens, webhook secrets or personal data.** Redact them as `improj_pat_***`.
        Security problems go to the private channel in SECURITY.md, not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version or commit you use.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node.js, browser, PHP or framework version and operating system.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the error `code`, HTTP status and `request_id` if the API answered with an error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem, without credentials.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed every token, secret and personal detail from this report.
          required: true
